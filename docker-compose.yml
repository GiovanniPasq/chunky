services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./docs:/app/docs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434/v1
      - ENRICHMENT_DEFAULT_BASE_URL=http://host.docker.internal:11434/v1

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://backend:8000
      - VITE_DEFAULT_MODEL_BASE_URL=http://host.docker.internal:11434/v1
    depends_on:
      - backend
